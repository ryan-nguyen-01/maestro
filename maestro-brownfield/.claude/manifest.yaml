schema_version: "1.0"
layout_version: "2.0"

ownership:
  framework:
    - ".claude/engine/**"
    - ".claude/**"
    - "scripts/**"
  project_shared:
    - ".claude/INSTRUCTIONS.md"
    - ".maestro/project.yaml"
    - ".maestro/methodology.yaml"
    - ".maestro/config/**"
    - ".maestro/registry/**"
    - ".maestro/knowledge/**"
    - ".maestro/work/**"
    - ".maestro/memory/project/**"
    - ".maestro/memory/tasks/**"
    - ".maestro/history/**"
    - ".maestro/runtime/README.md"
    - "intake/**"
  local_runtime:
    - ".maestro/runtime/**"
    - ".maestro/memory/sessions/**"

compatibility:
  phase: "consolidated-aw-layout"
  canonical_domains:
    control_plane: ".claude/engine"
    runs: ".maestro/work/runs"
  legacy_paths:
    supported: false
    paths:
      - ".agent"
      - ".runtime"
      - ".claude/control-plane"
  notes: ".claude/engine is the single canonical control plane (workflow, rules, templates, docs)."

writable_boundary:
  # Claude Code treats .claude/ as a protected directory: Write/Edit there is refused in acceptEdits and
  # permission allow-rules do not lift it (verified with Claude Code 2.1.287). Everything agents write at
  # runtime therefore lives in .maestro/; .claude/ holds only definitions that change during framework
  # maintenance (agents, skills, commands, settings, engine).
  protected_definitions: ".claude/**"
  workspace_state: ".maestro/**"

optional_domains:
  # Created on first use, only when a methodology overlay needs them. Templates may prune them; references
  # in shared engine docs stay valid and mean "when present".
  - ".maestro/governance"
  - ".maestro/observability"
  - ".maestro/design"
  - ".maestro/decision"
  - ".maestro/work/initiatives"
  - ".maestro/work/epics"
