schema_version: "1.0"
role: "artifact-registry"
documentation_root: "docs"

artifact_types:
  - id: "methodology"
    purpose: "Delivery operating model and flow selection rules."
    root: ".claude/engine/methodologies"
  - id: "industry-alignment"
    purpose: "Mapping from workspace methodology concepts to current production-agent system patterns."
    root: ".claude/engine/methodologies"
  - id: "run"
    purpose: "Execution attempt for a task, including checkpoints, trace links, eval evidence, approvals, and report."
    root: ".maestro/work/runs"
    template: ".claude/engine/templates/run.template.yaml"
  - id: "checkpoint"
    purpose: "Durable pause/resume point for a run or long task."
    root: ".maestro/work/runs"
    template: ".claude/engine/templates/checkpoint.template.yaml"
  # This variant does not scaffold .maestro/observability/ or .maestro/governance/ (deliberately
  # minimal layout). The next 8 types are the Enterprise Agent Governance overlay — only relevant
  # when the maintained project is itself an agent platform — and stay task-scoped, not permanent
  # top-level trees.
  - id: "trace-summary"
    purpose: "Reviewable summary of agent decisions, tool calls, handoffs, and evidence for a run."
    root: ".maestro/work/tasks/<task-id>"
    template: ".claude/engine/templates/trace-summary.template.yaml"
  - id: "eval-run"
    purpose: "Eval execution evidence for model, RAG, prompt, or production-agent behavior."
    root: ".maestro/work/tasks/<task-id>/advisories"
    template: ".claude/engine/templates/eval-run.template.yaml"
  - id: "approval-record"
    purpose: "Human or policy approval evidence for gated workflow transitions."
    root: ".maestro/work/tasks/<task-id>"
    template: ".claude/engine/templates/approval-record.template.yaml"
  - id: "audit-view"
    purpose: "Curated audit summary derived from work and history artifacts."
    root: ".maestro/history"
    template: ".claude/engine/templates/audit-view.template.md"
  - id: "agent-governance-policy"
    purpose: "Governance policy, hard refusals, and owner obligations for production agents."
    root: ".maestro/work/tasks/<task-id>"
    template: ".claude/engine/templates/agent-governance-policy.template.md"
    legacy_aliases:
      - "ae-constitution"
  - id: "agent-mission"
    purpose: "Per-agent mission, success criteria, non-goals, termination, and accountable owner."
    root: ".maestro/work/tasks/<task-id>"
    template: ".claude/engine/templates/agent-mission.template.md"
    legacy_aliases:
      - "ae-agent-mission"
  - id: "agent-behavior-contract"
    purpose: "Typed behavior contract: I/O, refusal, escalation, forbidden tools, tone, and SLA."
    root: ".maestro/work/tasks/<task-id>"
    template: ".claude/engine/templates/agent-behavior-contract.template.md"
    legacy_aliases:
      - "ae-behavior-contract"
  - id: "agent-autonomy-policy"
    purpose: "Granted autonomy level, blast radius, cost cap, and approval boundaries."
    root: ".maestro/work/tasks/<task-id>"
    template: ".claude/engine/templates/agent-autonomy-policy.template.md"
    legacy_aliases:
      - "ae-autonomy-profile"
  - id: "agent-definition"
    purpose: "Agent composition: persona, skills, tools, knowledge, memory, guards, and model routing."
    root: ".maestro/work/tasks/<task-id>"
    template: ".claude/engine/templates/agent-definition.template.md"
    legacy_aliases:
      - "ae-agent-genome"
  - id: "agent-eval-suite"
    purpose: "Golden, adversarial, regression, and drift eval definitions."
    root: ".maestro/work/tasks/<task-id>/advisories"
    template: ".claude/engine/templates/agent-eval-suite.template.yaml"
    legacy_aliases:
      - "ae-eval-suite"
  - id: "agent-audit-log"
    purpose: "Append-only version, eval, deployment, incident, and drift record."
    root: ".maestro/history"
    template: ".claude/engine/templates/agent-audit-log.template.yaml"
    legacy_aliases:
      - "ae-ledger"
  - id: "agent-interaction-protocol"
    purpose: "Agent-human, agent-agent, and agent-system protocol specs."
    root: ".maestro/work/tasks/<task-id>"
    template: ".claude/engine/templates/agent-interaction-protocol.template.md"
    legacy_aliases:
      - "ae-protocol"
  # The Spec-Driven Development overlay (optional; see ba-documentation-standard.md). docs/ is not
  # scaffolded by default — created on demand only when the user opts into this overlay for a task.
  - id: "vision"
    purpose: "Product direction and intended outcomes."
    root: "docs/product"
  - id: "prd"
    purpose: "Product requirements and success metrics."
    root: "docs/product/prds"
    template: ".claude/engine/templates/prd.template.md"
  - id: "feature"
    purpose: "Feature scope, business rules, and acceptance criteria."
    root: "docs/requirements/features"
    template: ".claude/engine/templates/feature.template.md"
  - id: "user-story"
    purpose: "User value and testable acceptance criteria."
    root: "docs/requirements/user-stories"
    template: ".claude/engine/templates/user-story.template.md"
  - id: "user-flow"
    purpose: "User interaction and system response flow."
    root: "docs/experience/user-flows"
  - id: "hld"
    purpose: "High-level system design and component boundaries."
    root: "docs/architecture/high-level-design"
    template: ".claude/engine/templates/hld.template.md"
  - id: "lld"
    purpose: "Detailed implementation design."
    root: "docs/architecture/low-level-design"
    template: ".claude/engine/templates/lld.template.md"
  - id: "adr"
    purpose: "Accepted architecture decision and consequences."
    root: "docs/architecture/decisions"
    template: ".claude/engine/templates/adr.template.md"
  - id: "test-strategy"
    purpose: "Quality approach, environments, and evidence ownership."
    root: "docs/quality"
  - id: "runbook"
    purpose: "Operational procedures and recovery."
    root: "docs/operations/runbooks"

  - id: "craft-review"
    purpose: "Review of an artifact against the house standards (CS/DS/AS/WS/AG) at a gate, by an independent reviewer (R-029-05)."
    root: ".maestro/work/tasks"
    template: ".claude/engine/templates/craft-review.template.yaml"
  - id: "retro"
    purpose: "Blameless retrospective: root causes, checkable preventions, quality signals, promotions (R-030-03)."
    root: ".maestro/work/tasks"
    template: ".claude/engine/templates/retro.template.md"
  - id: "house-standards"
    purpose: "The Maestro Way: the house quality bar for code, design, architecture, writing, and AI agents (R-029)."
    root: ".claude/engine/standards"

indexes:
  work: ".maestro/work/index.yaml"
  intake: ".maestro/registry/intake.yaml"
