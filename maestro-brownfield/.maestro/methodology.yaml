schema_version: "1.0"
methodology: "risk-based-routing"

catalog:
  risk-based-routing:
    name: "Risk-Based Workflow Routing"
    legacy_aliases:
      - "adaptive"
    document: ".claude/engine/methodologies/risk-based-routing.md"
  spec-driven-development:
    name: "Spec-Driven Development"
    abbreviation: "SDD"
    legacy_aliases:
      - "adlc"
    document: ".claude/engine/methodologies/spec-driven-development.md"
  enterprise-agent-governance:
    name: "Enterprise Agent Governance"
    legacy_aliases:
      - "agentic-enterprise"
      - "ae"
    document: ".claude/engine/methodologies/enterprise-agent-governance.md"
    operating_model:
      accountable_owner_required: true
      governance_policy_required_for_production_agents: true
      agent_artifacts:
        - "governance-policy"
        - "mission"
        - "behavior-contract"
        - "autonomy-policy"
        - "agent-definition"
        - "eval-suite"
        - "audit-log"
        - "interaction-protocol"
      lifecycle_stages:
        - "DEFINE"
        - "CONTRACT"
        - "COMPOSE"
        - "EVALUATE"
        - "HARDEN"
        - "APPROVE"
        - "DEPLOY"
        - "OPERATE"
        - "CHANGE_OR_RETIRE"
  eval-driven-ai:
    name: "Eval-Driven AI Development"
    legacy_aliases:
      - "ai-native"
    document: ".claude/engine/methodologies/eval-driven-ai.md"

selection_matrix: ".claude/engine/methodologies/selection-matrix.md"
industry_alignment: ".claude/engine/methodologies/industry-alignment.md"

defaults:
  execution_mode: "assisted"
  verification_owner: "shared"

industry_patterns:
  durable-workflow:
    maps_to:
      - ".maestro/work/"
      - ".maestro/memory/tasks/"
      - ".maestro/runtime/"
    use_when:
      - "long_running_task"
      - "resume_required"
      - "human_in_the_loop"
  artifact-management:
    # No .maestro/design/ or .maestro/decision/ index in this variant (deliberately minimal layout).
    # Reference material (PRD/HLD/ADR-like docs the user provides) lives in intake/, triaged into
    # .maestro/registry/intake.yaml; the existing project's own docs stay where the project keeps them.
    maps_to:
      - ".maestro/registry/artifacts.yaml"
      - ".maestro/registry/intake.yaml"
      - "intake/"
    use_when:
      - "prd_or_design_required"
      - "architecture_decision_required"
      - "official_deliverable_required"
  eval-driven-ai:
    # No .maestro/governance/ eval-suite tree in this variant; eval-engineer's advisory output for a
    # task lives with the task, not in a permanent top-level governance directory.
    maps_to:
      - ".claude/engine/methodologies/eval-driven-ai.md"
      - ".maestro/work/tasks/<task-id>/advisories/eval-engineer.yaml"
      - ".maestro/runtime/agent-activity.yaml"
    use_when:
      - "model_behavior_change"
      - "rag_or_prompt_change"
      - "agent_quality_claim"
  enterprise-governance:
    # No .maestro/governance/ or docs/operations/ scaffolding in this variant. This overlay only
    # applies when the maintained project is itself an agent platform; governance artifacts then
    # live task-scoped under .maestro/work/tasks/<task-id>/ using the agent-* templates.
    maps_to:
      - ".claude/engine/templates/agent-governance-policy.template.md"
      - ".maestro/work/tasks/<task-id>/"
      - ".maestro/history/"
    use_when:
      - "production_autonomy"
      - "named_steward_required"
      - "audit_or_compliance_required"

execution_modes:
  direct:
    purpose: "Fast implementation with explicit user-owned or shared verification."
    required_artifacts: []
    workflow_state_machine: false
  assisted:
    purpose: "Bounded analysis, implementation, and evidence without the full governed pipeline."
    required_artifacts:
      - "task.yaml"
      - "progress.yaml"
      - "verification.yaml"
    workflow_state_machine: false
  governed:
    purpose: "Auditable multi-agent delivery for high-risk, cross-component, or regulated work."
    required_artifacts:
      - "task.yaml"
      - "task-analysis.yaml"
      - "implementation-plan.yaml"
      - "progress.yaml"
      - "verification.yaml"
    workflow_state_machine: true
# No "autonomous" execution mode in this variant: NO AUTOPILOT — /ship is removed. Every step
# confirms with the user (see CLAUDE.md Variant Profile).

methodology_triggers:
  enterprise-agent-governance:
    - "production_agent_operation"
    - "named_owner_required"
    - "behavior_contract_required"
    - "autonomy_policy_change"
    - "agent_fleet_or_marketplace"
    - "audit_log_required"
    - "cross_agent_or_agent_human_protocol"

escalation:
  allow_automatic_upgrade: true
  allow_automatic_downgrade: false
  governed_triggers:
    - "security_or_privacy"
    - "data_migration"
    - "public_contract_change"
    - "cross_component_change"
    - "production_or_infrastructure_change"
    - "multiple_parallel_workstreams"
